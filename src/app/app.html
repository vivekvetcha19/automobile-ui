<h1>Brand List</h1>

<table border="1">
  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Country</th>
      <th>Created Date</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let brand of brands">
      <td>{{ brand.id }}</td>
      <td>{{ brand.name }}</td>
      <td>{{ brand.country }}</td>
      <td>{{ brand.createdDate }}</td>
    </tr>
  </tbody>
</table>
