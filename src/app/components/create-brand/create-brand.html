<div class="container mt-5">

  <h2>Create Brand</h2>

  <form (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Brand Name</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="brand.name"
        name="name"
        required
        maxlength="100">
        <small
          class="text-danger"
          *ngIf="brand.name && brand.name.length >= 100">
           Maximum 100 characters allowed
        </small>
    </div>

    <div class="mb-3">
      <label class="form-label">Country</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="brand.country"
        name="country"
        required
        maxlength="100">
        <small
          class="text-danger"
          *ngIf="brand.country && brand.country.length >= 100">
          Maximum 100 characters allowed
        </small>
    </div>

    <button
      class="btn btn-primary"
      [disabled]="!brand.name?.trim() || !brand.country?.trim()">

      {{ brand.id > 0 ? 'Update Brand' : 'Create Brand' }}

    </button>

  </form>

</div>
