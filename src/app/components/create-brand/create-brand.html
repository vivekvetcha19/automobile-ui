<div class="container mt-5">

  <h2>Create Brand</h2>

  <form (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Brand Name</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="brand.name"
        name="name">
    </div>

    <div class="mb-3">
      <label class="form-label">Country</label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="brand.country"
        name="country">
    </div>

    <button class="btn btn-primary">
      Create Brand
    </button>

  </form>

</div>
